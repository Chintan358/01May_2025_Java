<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>

            <div class="logo">
                <img src="logo-tops.png" alt="">
            </div>
            <div class="title">
                Student Registration & Accounting System
            </div>
        </header>
        <div class="main">
            <div class="reg">
                <h2 align="center">Student Login</h2>
                <hr>
                <table>
                    <tr>
                        <td>Login As</td>
                        <td>
                            <select name="" id="">
                                <option value="">BE</option>
                                 <option value="">BCA</option>
                                  <option value="">MCA</option>
                            </select>
                        </td>

                    </tr>
                    <tr>
                        <td>Username</td>
                        <td><input type="text"></td>
                    </tr>

                    <tr>
                        <td>Password</td>
                        <td><input type="password" name="" id=""></td>
                    </tr>

                    <tr>
                        <td></td>
                        <td>
                            <button type="submit">Submit</button>
                            <button type="reset">Reset</button>
                        </td>
                    </tr>
                </table>
            </div>
        </div>
        <footer></footer>
    </div>

</body>
</html>
