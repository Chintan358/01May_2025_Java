<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">

    <script>
        const validation = () => {

            var uname = document.getElementById("uname").value
            var email = document.getElementById("email").value
            var pass = document.getElementById("pass").value
            var cpass = document.getElementById("cpass").value

            var unameErr = document.getElementById("unameErr")
            var emailErr = document.getElementById("emailErr")
            var passErr = document.getElementById("passErr")
            var cpassErr = document.getElementById("cpassErr")

            var btn = document.getElementById("smbtn")

            var unameExp = /^[a-zA-Z]+$/
            var emailExp = /^[a-zA-Z0-9_-]+@[a-zA-Z]+\.[a-zA-Z]{2,4}$/

            //abc@gmail.com

            if (uname == "" || uname == null) {
                unameErr.innerHTML = "Username required !!!"
                smbtn.disabled = true
            }
            else if (!unameExp.test(uname)) {
                unameErr.innerHTML = "Only Alphabates are allowed"
            }
            else {
                unameErr.innerHTML = ""
                smbtn.disabled = false
            }

            if (email == "" || email == null) {
                emailErr.innerHTML = "Email Required !!!"
                smbtn.disabled = true
            }
            else if (!emailExp.test(email)) {
                emailErr.innerHTML = "Invalid email formate"
            }
            else {
                emailErr.innerHTML = ""
                smbtn.disabled = false
            }

            if (pass == "" || pass == null) {
                passErr.innerHTML = "Password Required !!!"
                smbtn.disabled = true
            }
            else {
                passErr.innerHTML = ""
                smbtn.disabled = false
            }

            if (cpass == "" || cpass == null) {
                cpassErr.innerHTML = "Confirm Password Required !!!"
                smbtn.disabled = true
            }
            else if (pass != cpass) {
                cpassErr.innerHTML = "Cpass must be same as a password"
                smbtn.disabled = true
            }
            else {
                cpassErr.innerHTML = ""
                smbtn.disabled = false
            }




        }
    </script>
</head>

<body>

    <div class="container">

        <div class="row">

            <div class="col-5 mx-auto card p-5 mt-5 shadow-lg">
                <h2 class="text-danger">Registration Form</h2>
                <hr>

                <form action="">

                    <div class="form-group">
                        <label for="uname">Username</label>
                        <input type="text" id="uname" class="form-control" onkeyup="validation()">
                        <span id="unameErr" class="text-danger"></span>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="text" id="email" class="form-control" onkeyup="validation()">
                        <span id="emailErr" class="text-danger"></span>
                    </div>

                    <div class="form-group">
                        <label for="pass">Password</label>
                        <input type="password" id="pass" class="form-control" onkeyup="validation()">
                        <span id="passErr" class="text-danger"></span>
                    </div>

                    <div class="form-group">
                        <label for="cpass">Confirm Password</label>
                        <input type="password" id="cpass" class="form-control" onkeyup="validation()">
                        <span id="cpassErr" class="text-danger"></span>
                    </div>
                    <br>
                    <input type="submit" id="smbtn" class="btn btn-success">
                    <input type="reset" class="btn btn-primary">
                </form>


            </div>





        </div>




    </div>



</body>

</html>
